# Which rules reach which agent, and in what order.
#
# Lookup order for each entry, first hit wins:
#   rules/<dir>/<name>.<agent>.md    agent-specific short form
#   rules/<dir>/<name>.md            full form
#
# Order matters for codex and grok, whose rules concatenate into one AGENTS.md.
# For claude each rule installs as its own file, so order is cosmetic.

[budgets]
# Hard caps in characters. 0 means no cap. bin/build fails before writing when a
# rendered file exceeds its cap. Grok truncates AGENTS.md at 10000.
grok = 10000
codex = 0
claude = 0
pi = 0

[claude]
agent = "claude"
core = ["mannered-prose", "about-me", "unslop", "aryan-voice", "direction-first", "fidelity-first", "read-before-edit"]
shared = [
  "ui-verification",
  "argent",
  "portless",
  "waiting",
  "context7",
  "plannotator",
]

[codex]
agent = "codex"
core = ["mannered-prose", "about-me", "unslop", "aryan-voice", "direction-first", "fidelity-first", "read-before-edit"]
shared = [
  "ui-verification",
  "argent",
  "portless",
  "waiting",
  "context7",
  "plannotator",
]

# Grok truncates at 10000 chars, so it takes tier 0 plus short forms only.
# fidelity-first and read-before-edit are omitted deliberately: grok does no
# clone or component work (aesthetic-judgment rate 1.0 per 10k chars against
# claude's 3.4).
[grok]
agent = "grok"
core = ["about-me", "unslop", "aryan-voice", "direction-first"]
shared = ["portless"]

# pi (@earendil-works/pi-coding-agent) reads ~/.pi/agent/AGENTS.md as its global
# layer. Same ruleset as codex: both are terminal coding agents and pi's default
# model is a codex-family GPT-5.6.
#
# No rules/agent/pi.md on purpose. The claude and codex profiles quote measured
# per-agent numbers from transcript audits. There is no pi audit yet, so pi gets
# no profile rather than one describing a different agent.
[pi]
agent = "pi"
core = ["mannered-prose", "about-me", "unslop", "aryan-voice", "direction-first", "fidelity-first", "read-before-edit"]
shared = [
  "ui-verification",
  "argent",
  "portless",
  "waiting",
  "context7",
  "plannotator",
]
