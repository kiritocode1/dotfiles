<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Underpass</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #stage canvas { outline: none; touch-action: none; }
    #fail { position: fixed; inset: 0; margin: 0; padding: 24px; color: #e8d8c4; font: 14px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
    #fail:empty { display: none; }
  </style>
  <script>
    // A failed module or a startup error otherwise leaves a black page with nothing to read.
    const fail = (msg) => { const el = document.getElementById('fail'); if (el && !window.__noir) el.textContent += msg + '\n'; };
    addEventListener('error', (e) => fail(e.error ? String(e.error.stack ?? e.error) : e.message ? `${e.message}\n  at ${e.filename}:${e.lineno}` : `failed to load ${e.target?.src ?? e.target?.href ?? 'a resource'}`), true);
    addEventListener('unhandledrejection', (e) => fail(String(e.reason?.stack ?? e.reason)));
  </script>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="stage"></div>
  <pre id="fail"></pre>
  <script type="module" src="main.js" onerror="fail('main.js or one of its imports failed to load')"></script>
</body>
</html>
