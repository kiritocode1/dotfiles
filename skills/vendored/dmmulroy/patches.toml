# Edits we own on top of dmmulroy/.dotfiles.
# bin/patch reapplies these after every skill install. Without them, the next
# `npx skills add` silently reverts each one.

[[patch]]
skill  = "write-discoverable-code"
op     = "frontmatter-remove"
key    = "disable-model-invocation"
reason = "Applies to every file written. Slash-only meant it never fired: never typed in 6961 prompts. Upstream has since promoted it too, so this is now a no-op that guards against a regression."

[[patch]]
skill  = "writing-for-agents"
op     = "frontmatter-remove"
key    = "disable-model-invocation"
reason = "Should fire whenever a SKILL.md, AGENTS.md, or rule is edited. Its own SKILL-MECHANICS.md diagnoses this exact failure."

[[patch]]
skill  = "workday-training"
op     = "delete"
reason = "Automates SCORM compliance courses on Mulroy's employer's LMS. Not applicable here."

[[patch]]
skill  = "use-computer-mcp"
op     = "append"
file   = "appends/use-computer-mcp.md"
marker = "## On this machine"
reason = "The skill documents Pi's computer_* tool names. Claude namespaces MCP tools as mcp__computer__*, so without this the agent calls a tool that does not exist. Also records the binary path and the re-register commands."
