<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330"><rect width="960" height="330" fill="#f5f3ed"/><style>text{font-family:Arial,sans-serif;fill:#222;font-size:18}.title{font-size:22;font-weight:bold}.small{font-size:15;fill:#555}.box{fill:#fff;stroke:#555;stroke-width:1.5}.new{stroke:#246c55;stroke-width:2}.line{stroke:#555;stroke-width:2;fill:none}</style><text x="32" y="38" class="title">Current</text><rect x="32" y="57" width="230" height="74" rx="8" class="box"/><text x="50" y="87">Long always-on rule</text><text x="50" y="111" class="small">trigger + procedure copied</text><path d="M262 94h55" class="line"/><rect x="317" y="57" width="240" height="74" rx="8" class="box"/><text x="336" y="87">Agent may read skill</text><text x="336" y="111" class="small">often after first choice</text><path d="M557 94h55" class="line"/><rect x="612" y="57" width="315" height="74" rx="8" class="box"/><text x="631" y="87">Prompt counts</text><text x="631" y="111" class="small">do not show task success</text><text x="32" y="175" class="title">Proposed</text><rect x="32" y="194" width="230" height="96" rx="8" class="box new"/><text x="50" y="225">Short trigger</text><text x="50" y="250" class="small">before first open choice</text><text x="50" y="271" class="small">skip fixed / narrow work</text><path d="M262 242h55" class="line"/><rect x="317" y="194" width="240" height="96" rx="8" class="box new"/><text x="336" y="225">Skill procedure</text><text x="336" y="250" class="small">source inspected + applied</text><text x="336" y="271" class="small">task-specific proof</text><path d="M557 242h55" class="line"/><rect x="612" y="194" width="315" height="96" rx="8" class="box new"/><text x="631" y="225">Audited task outcomes</text><text x="631" y="250" class="small">eligible / ordered / verified</text><text x="631" y="271" class="small">corrections + unknowns</text></svg>